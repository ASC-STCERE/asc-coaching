<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ASC Coaching — Mes athlètes</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0e">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mes athlètes">
<meta name="mobile-web-app-capable" content="yes">

<script src="config-staff.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0d0d0e; overflow:hidden;
               font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

  #cadre { position:fixed; inset:0; width:100%; height:100%; border:0;
           padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }

  #splash { position:fixed; inset:0; background:#0d0d0e; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:24px; z-index:10; transition:opacity .45s; }
  #splash.off { opacity:0; pointer-events:none; }
  #splash img { width:150px; height:auto; }
  .barre { width:120px; height:3px; background:#26262b; border-radius:2px; overflow:hidden; }
  .barre i { display:block; height:100%; width:35%; background:#f4c400; border-radius:2px;
             animation:va 1.1s ease-in-out infinite; }
  @keyframes va { 0%{margin-left:-35%} 100%{margin-left:100%} }

  #porte { position:fixed; inset:0; z-index:12; background:#0d0d0e; color:#f2f2f4;
           display:none; flex-direction:column; justify-content:center; align-items:center;
           padding:30px calc(26px + env(safe-area-inset-left)); gap:16px; text-align:center; }
  #porte img { width:112px; height:auto; margin-bottom:6px; }
  #porte h2 { font-size:21px; font-weight:800; }
  #porte p { color:#8b8b94; font-size:14px; line-height:1.5; max-width:320px; }
  #porte input { width:100%; max-width:320px; background:#17171a; border:1px solid #2f2f34;
                 border-radius:10px; padding:14px 16px; color:#f2f2f4; font:inherit; font-size:17px;
                 text-align:center; letter-spacing:.08em; }
  #porte button { width:100%; max-width:320px; background:#f4c400; color:#0d0d0e; border:0;
                  border-radius:10px; padding:15px; font:inherit; font-size:16px; font-weight:700;
                  cursor:pointer; }
  #err { color:#ff8a7a; font-size:14px; min-height:1.3em; }
</style>
</head>
<body>

<div id="splash">
  <img src="../logo-asc.png" alt="ASC Coaching">
  <div class="barre"><i></i></div>
</div>

<div id="porte">
  <img src="../logo-asc.png" alt="ASC Coaching">
  <h2>Tableau de bord</h2>
  <p>Saisis ton mot de passe une seule fois. Il restera enregistré sur cet appareil.</p>
  <input id="cle" type="password" inputmode="text" autocomplete="off" placeholder="Mot de passe">
  <button id="entrer">Ouvrir</button>
  <div id="err"></div>
</div>

<iframe id="cadre" title="Mes athlètes"></iframe>

<script>
  var CLE_MEMO = 'asc_staff_cle';

  function lire(k)  { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function ecrire(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function el(id)   { return document.getElementById(id); }

  function ouvrir(cle) {
    var cadre = el('cadre');
    cadre.src = LIEN_EXEC + '?page=staff&k=' + encodeURIComponent(cle);
    cadre.addEventListener('load', function () {
      setTimeout(function () { el('splash').classList.add('off'); }, 300);
    });
    setTimeout(function () { el('splash').classList.add('off'); }, 9000);
  }

  var memo = lire(CLE_MEMO);
  if (memo) {
    ouvrir(memo);
  } else {
    el('splash').classList.add('off');
    el('porte').style.display = 'flex';
  }

  el('entrer').addEventListener('click', function () {
    var v = el('cle').value.trim();
    if (!v) { el('err').textContent = 'Saisis ton mot de passe.'; return; }
    ecrire(CLE_MEMO, v);
    el('porte').style.display = 'none';
    el('splash').classList.remove('off');
    ouvrir(v);
  });

  el('cle').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') el('entrer').click();
  });

  // Si le mot de passe enregistré devient faux, une pression longue sur le logo le réinitialise.
  el('splash').addEventListener('dblclick', function () {
    try { localStorage.removeItem(CLE_MEMO); } catch (e) {}
    location.reload();
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
